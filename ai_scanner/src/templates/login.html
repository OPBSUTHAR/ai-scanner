<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI SCANNER // ARCHIVE v3.0 — Entry</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="/static/css/login.css">
</head>
<body class="login-body">

<!-- BACKGROUND LAYERS – PARCHMENT -->
<div class="bg-layer">
  <div class="bg-grid"></div>
  <div class="bg-nebula login-nebula"></div>
  <div class="bg-scanline"></div>
  <div class="bg-vignette"></div>
</div>

<!-- FLOATING ORNAMENTS -->
<div class="login-orb login-orb-1"></div>
<div class="login-orb login-orb-2"></div>
<div class="login-orb login-orb-3"></div>

<!-- MOUSE GLOW -->
<div class="mouse-glow" id="mouse-glow"></div>

<!-- LOGIN CARD -->
<div class="login-wrap">
  <div class="login-card" id="login-card">

    <div class="login-frame">
      <div class="login-logo">
        <img src="/static/images/logo.svg" alt="Archive">
      </div>
      <div class="ornament">✦ ✦ ✦</div>
      <h1 class="login-title">The Archive</h1>
      <p class="login-sub">DOCUMENT SCANNER // v3.0</p>
      <div class="login-rule"></div>
      <p class="login-invite">State thy name to enter the archive</p>

      <form class="login-form" id="login-form" autocomplete="off">
        <input type="text" id="login-name" class="login-input" placeholder="Your preferred name..." maxlength="40" autofocus>
        <button type="submit" class="login-btn" id="login-btn">
          <span class="login-btn-label">ENTER THE ARCHIVE</span>
          <span class="login-btn-arrow">→</span>
        </button>
      </form>

      <p class="login-note" id="login-note">Quick entry — no password needed</p>
    </div>

    <div class="login-footer">ARCHIVE KEEPER // EST. MMXXVI</div>
  </div>
</div>

<script src="/static/js/login.js"></script>
</body>
</html>
